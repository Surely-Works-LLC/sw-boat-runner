[package]
name = "sw-boat-runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Self-hosted GitHub Actions runners on boat machines, reused across jobs"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", default-features = false, features = ["v4"] }

[dev-dependencies]
proptest = "1"
