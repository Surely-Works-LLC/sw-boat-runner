[package]
name = "sw-boat-runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Self-hosted GitHub Actions runners on boat machines, reused across jobs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Surely-Works-LLC/sw-boat-runner"
readme = "README.md"
keywords = ["github-actions", "self-hosted", "runner", "ci", "autoscaling"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[dependencies]
# GitHub App auth signs its JWT with ring and reads the PEM key with rustls-pki-types,
# the crates ureq's rustls already brings; base64 is ureq's too.
base64 = "0.23"
ring = "0.17"
rpassword = "7.5.5"
rustls-pki-types = { version = "1.12", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ctrl-C and SIGTERM set a flag, so `snapshot` deletes its fork before exiting.
signal-hook = { version = "0.3", default-features = false }
toml = "1.2"
ureq = "3"
uuid = { version = "1", default-features = false, features = ["v4"] }

[dev-dependencies]
proptest = "1"

[[example]]
name = "bench"
path = "bench/main.rs"
