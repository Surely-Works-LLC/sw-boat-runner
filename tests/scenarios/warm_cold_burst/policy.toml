# Pins: Fork(none): an empty warm pool forks kept machines for its jobs, one per slots_per_box jobs, up to max_boxes.
repo = "acme/app"

[[pool]]
name = "ci"
labels = ["self-hosted", "Linux", "pool-a"]
machine_type = "xlarge"
snapshot = "snap-1"
preset = "warm"
slots_per_box = 2
min_up = 2
max_boxes = 4
