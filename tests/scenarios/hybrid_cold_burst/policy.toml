# Pins: Fork(none) then Fork(job): an empty hybrid pool forks kept machines up to min_up, then one machine per job left, up to max_boxes.
repo = "acme/app"

[[pool]]
name = "ci"
labels = ["self-hosted", "Linux", "pool-a"]
machine_type = "xlarge"
snapshot = "snap-1"
preset = "hybrid"
slots_per_box = 2
min_up = 2
max_boxes = 4
