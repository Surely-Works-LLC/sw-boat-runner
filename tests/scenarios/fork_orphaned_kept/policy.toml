# Pins: Delete: a pool switched from warm to fork deletes kept machines up or starting unless a runner is Busy or Registered.
repo = "acme/app"

# Was `warm`; switched to `fork`, so no step uses its kept machines any more.
[[pool]]
name = "ci"
labels = ["self-hosted", "Linux", "pool-a"]
machine_type = "xlarge"
snapshot = "snap-1"
preset = "fork"
max_boxes = 4
