# Pins: Delete: a fork whose job finished goes (runner offline after use, stopped, or no runner within register_timeout_s), a Busy one stays; Register fills a fresh fork.
repo = "acme/app"

[[pool]]
name = "ci"
labels = ["self-hosted", "Linux", "pool-a"]
machine_type = "xlarge"
snapshot = "snap-1"
preset = "fork"
max_boxes = 8
