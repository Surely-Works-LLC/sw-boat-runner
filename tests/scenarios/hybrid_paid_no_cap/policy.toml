# Pins: Start budget: at a paid quote and the default cap of 0, nothing starts; free slots still take runners.
repo = "acme/app"

[[pool]]
name = "ci"
labels = ["self-hosted", "Linux", "pool-a"]
machine_type = "xlarge"
snapshot = "snap-1"
preset = "hybrid"
slots_per_box = 2
min_up = 2
max_boxes = 4
