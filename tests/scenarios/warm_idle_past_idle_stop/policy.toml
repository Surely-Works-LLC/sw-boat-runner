# Pins: Stop: kept machines idle past idle_stop_s stop while more than min_up stay up; a recently busy one stays.
repo = "acme/app"

[[pool]]
name = "ci"
labels = ["self-hosted", "Linux", "pool-a"]
machine_type = "xlarge"
snapshot = "snap-1"
preset = "warm"
slots_per_box = 2
min_up = 2
max_boxes = 4
