# Pins: Unregister: a Registered runner past register_timeout_s is unregistered and its slot takes a Register.
repo = "acme/app"

[[pool]]
name = "ci"
labels = ["self-hosted", "Linux", "pool-a"]
machine_type = "xlarge"
snapshot = "snap-1"
preset = "warm"
slots_per_box = 2
min_up = 2
max_boxes = 4
register_timeout_s = 300
