# Pins: Routing: a job counts only for the first pool in the file whose labels match it.
repo = "acme/app"

[[pool]]
name = "ci"
labels = ["self-hosted", "Linux", "pool-a"]
machine_type = "xlarge"
snapshot = "snap-1"
preset = "hybrid"
slots_per_box = 2
max_boxes = 4

[[pool]]
name = "big"
labels = ["self-hosted", "Linux", "pool-a", "big"]
machine_type = "xlarge"
snapshot = "snap-1"
preset = "warm"
slots_per_box = 2
max_boxes = 2
