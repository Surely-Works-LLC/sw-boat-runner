# The pool .github/workflows/dogfood.yml runs this repository's tests on.
# The workflow replaces DOGFOOD_SNAPSHOT with the repository variable of that name.
repo = "Surely-Works-LLC/sw-boat-runner"

[[pool]]
name = "dogfood"
labels = ["self-hosted", "sw-boat-runner-dogfood"]
machine_type = "default"
snapshot = "DOGFOOD_SNAPSHOT"
preset = "fork"
max_boxes = 2
fork_ttl_s = 1800
