name: release
# A pushed tag vX.Y.Z builds the release binaries, attests their build provenance and
# publishes them with SHA256SUMS on the GitHub Release for the tag. The targets are the
# same as the `release` job in ci.yml, so every pull request has already built them.
# Verify a download with:
#   sha256sum --ignore-missing -c SHA256SUMS
#   gh attestation verify sw-boat-runner-<target>.tar.gz --repo Surely-Works-LLC/sw-boat-runner
on:
  push:
    tags: ['v*']
concurrency:
  group: release-${{ github.ref }}
permissions: {}
jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
      TAG: ${{ github.ref_name }}
      CARGO_PROFILE_RELEASE_STRIP: "true"
    strategy:
      fail-fast: true
      matrix:
        include:
          # glibc, built on the oldest supported Ubuntu (glibc 2.35) with its own gcc, so the
          # binary runs on that and anything newer, boat machines included. No musl, no apt.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          # For `check` and `plan` on a Mac.
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: The tag matches Cargo.toml
        run: grep -qx "version = \"${TAG#v}\"" Cargo.toml || { echo "Cargo.toml version is not ${TAG#v}" >&2; exit 1; }
      - run: rustup toolchain install stable --profile minimal -t "$TARGET"
      # No cache: a release builds from nothing, so no other run's cache goes into it.
      - run: cargo build --locked --release --target "$TARGET"
      - name: Package
        run: |
          bin="target/$TARGET/release/sw-boat-runner"
          "$bin" --version
          mkdir -p dist stage
          cp "$bin" LICENSE-MIT LICENSE-APACHE README.md stage/
          tar -C stage -czf "dist/sw-boat-runner-$TARGET.tar.gz" sw-boat-runner LICENSE-MIT LICENSE-APACHE README.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sw-boat-runner-${{ matrix.target }}
          path: dist/sw-boat-runner-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job with write access: it creates the release and signs the attestation.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sw-boat-runner-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes are the version's CHANGELOG.md section.
          awk -v v="${TAG#v}" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { next }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          # No --clobber: a re-run fails on an asset that is already published rather
          # than replace it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS
          else
            pre=()
            [[ $TAG != *-* ]] || pre=(--prerelease)
            gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS --verify-tag \
              --title "$TAG" --notes-file notes.md "${pre[@]}"
          fi
