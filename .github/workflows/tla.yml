name: tla
# TLC runs on main only when the spec or this workflow changes, and on demand.
# The spec does not read src/, so a Rust change cannot change TLC's result;
# spec/README.md has the command to run TLC locally.
on:
  push:
    branches: [main]
    paths:
      - spec/**
      - .github/workflows/tla.yml
  workflow_dispatch:
concurrency:
  group: tla-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  tla:
    name: tla (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # The fixed design must pass every property.
          - name: hybrid
            cfg: spec/BoatRunner.cfg
          - name: hybrid-minup
            cfg: spec/BoatRunner.cfg
            edit: 's/^MinUp = 0/MinUp = 1/;s/^InitStopped = {m1}/InitStopped = {}/'
          - name: warm
            cfg: spec/BoatRunner.cfg
            edit: 's/^Placement = .*/Placement = {"slot", "resume"}/'
          - name: fork
            cfg: spec/BoatRunnerFork.cfg
          # Each fix off must still produce its counterexample (spec/README.md).
          - name: crash-spend
            cfg: spec/BoatRunner.cfg
            edit: 's/^FixCrashSpend = TRUE/FixCrashSpend = FALSE/'
            expect: Invariant StartBudget is violated.
          - name: stale-act
            cfg: spec/BoatRunner.cfg
            edit: 's/^FixStaleAct = TRUE/FixStaleAct = FALSE/'
            expect: Action property NoBusyStop is violated.
          - name: reg-seen
            cfg: spec/BoatRunnerFork.cfg
            edit: 's/^FixRegSeen = TRUE/FixRegSeen = FALSE/'
            expect: Action property EphemeralIsolation is violated.
          - name: crash-seen
            cfg: spec/BoatRunnerFork.cfg
            edit: 's/^FixCrashSeen = TRUE/FixCrashSeen = FALSE/'
            expect: Action property EphemeralIsolation is violated.
          # TLC does not name the temporal property that fails, so this model
          # keeps NoStarvation alone.
          - name: fork-key
            cfg: spec/BoatRunnerFork.cfg
            edit: 's/^FixForkKey = TRUE/FixForkKey = FALSE/;/^PROPERTY NoStarvation$/!{/^PROPERTY /d;}'
            expect: Temporal properties were violated.
          # Three included starts leave room for the free orphans under max_boxes 2.
          - name: kept-inflight
            cfg: spec/BoatRunner.cfg
            edit: 's/^MinUp = 0/MinUp = 1/;s/^InitStopped = {m1}/InitStopped = {}/;s/^Included = 1/Included = 3/;s/^FixKeptInflight = TRUE/FixKeptInflight = FALSE/'
            expect: Invariant MaxBoxes is violated.
          # A fork the listing does not show yet breaks each invariant on its own.
          - name: list-lag
            cfg: spec/BoatRunnerFork.cfg
            edit: 's/^FixListLag = TRUE/FixListLag = FALSE/;/^INVARIANT NoDoubleFork$/d'
            expect: Invariant MaxBoxes is violated.
          - name: list-lag-fork
            cfg: spec/BoatRunnerFork.cfg
            edit: 's/^FixListLag = TRUE/FixListLag = FALSE/;/^INVARIANT MaxBoxes$/d'
            expect: Invariant NoDoubleFork is violated.
          # A create whose answer is lost while boat makes the machine.
          - name: lost-create
            cfg: spec/BoatRunnerFork.cfg
            edit: 's/^FixLostCreate = TRUE/FixLostCreate = FALSE/;/^INVARIANT NoDoubleFork$/d'
            expect: Invariant MaxBoxes is violated.
          - name: lost-create-fork
            cfg: spec/BoatRunnerFork.cfg
            edit: 's/^FixLostCreate = TRUE/FixLostCreate = FALSE/;/^INVARIANT MaxBoxes$/d'
            expect: Invariant NoDoubleFork is violated.
          - name: lost-spend
            cfg: spec/BoatRunnerFork.cfg
            edit: 's/^FixLostSpend = TRUE/FixLostSpend = FALSE/'
            expect: Invariant StartBudget is violated.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Fetch tla2tools 1.7.4
        run: |
          curl -fsSL -o tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  tla2tools.jar" | sha256sum -c -
      # -deadlock turns deadlock checking off: arrivals and faults are bounded, so
      # every behaviour ends in a quiescent state. NoStarvation and Settles catch
      # a state that is stuck with work left.
      - name: TLC
        env:
          CFG: ${{ matrix.cfg }}
          EDIT: ${{ matrix.edit }}
          EXPECT: ${{ matrix.expect }}
        run: |
          sed -e "$EDIT" "$CFG" > spec/Variant.cfg
          cat spec/Variant.cfg
          set +e
          java -XX:+UseParallelGC -cp tla2tools.jar tlc2.TLC -workers auto -deadlock \
            -config spec/Variant.cfg spec/BoatRunner.tla | tee tlc.log
          status=${PIPESTATUS[0]}
          set -e
          # The counts show in the run's annotations.
          stats=$(grep -E "distinct states found, [0-9]+ states left|^Finished in" tlc.log | tr '\n' ' ' || true)
          echo "::notice title=TLC ${{ matrix.name }}::exit $status; $stats"
          if [ -z "$EXPECT" ]; then
            exit "$status"
          fi
          if [ "$status" -eq 0 ]; then
            echo "expected a violation: $EXPECT"
            exit 1
          fi
          grep -qF "$EXPECT" tlc.log
