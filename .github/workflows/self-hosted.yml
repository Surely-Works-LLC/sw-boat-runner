name: self-hosted
# Runs this repository's tests on a boat machine that sw-boat-runner forks for the job,
# through the reusable `runners` workflow. It runs only when started by hand (Actions,
# self-hosted, Run workflow) on main, and needs the repository variable BOAT_SNAPSHOT;
# examples/in-workflow/README.md has the setup. The daemon signs in as the GitHub App in
# the variable BOAT_APP_ID and the secret BOAT_APP_PRIVATE_KEY.
on:
  workflow_dispatch:
permissions:
  contents: read
# Both jobs run only for main. The runner is registered on the repository, so while the
# daemon runs it also serves any other queued job that asks for its per-run label, such as
# one from a pull request that edits a workflow: examples/in-workflow/README.md#pull-requests.
jobs:
  runners:
    if: vars.BOAT_SNAPSHOT != '' && github.ref == 'refs/heads/main'
    # actions: read lets the run's own token list the run's jobs.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/runners.yml
    with:
      snapshot: ${{ vars.BOAT_SNAPSHOT }}
      ref: ${{ github.sha }}
      app-id: ${{ vars.BOAT_APP_ID }}
    secrets:
      BOAT_API_KEY: ${{ secrets.BOAT_API_KEY }}
      app-private-key: ${{ secrets.BOAT_APP_PRIVATE_KEY }}
  test:
    if: vars.BOAT_SNAPSHOT != '' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, "boat-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: cargo test --locked
