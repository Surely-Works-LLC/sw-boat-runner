name: runners
# Reusable: runs sw-boat-runner for the length of the calling workflow run, with a pool
# that only this run's jobs can use, and deletes the pool's machines at the end.
# examples/in-workflow/README.md has the caller's side.
on:
  workflow_call:
    inputs:
      snapshot:
        description: The boat snapshot machines start from.
        required: true
        type: string
      machine_type:
        description: small, default, large or xlarge.
        default: default
        type: string
      max_boxes:
        description: Most machines up or starting at once.
        default: 4
        type: number
      pool:
        description: >-
          More lines for the pool's policy, such as a preset or min_up. The default gives
          every job a fresh machine.
        default: preset = "fork"
        type: string
      name:
        description: >-
          Lowercase letters and digits. Set it when one run calls this workflow more than
          once; the pool's label then ends in -<name>.
        default: ""
        type: string
      ref:
        # A called workflow cannot read the ref it was called at (github.workflow_ref and
        # workflow_sha name the caller's workflow), so the daemon's ref is its own pin.
        # Required, with no default: a caller that pins `uses:` but leaves `ref` out would
        # otherwise build whatever main is now, with its keys in the job.
        description: >-
          The sw-boat-runner tag or commit to build, such as v0.2.0. Keep it the same as
          the ref in the caller's `uses:` line.
        required: true
        type: string
      app-id:
        description: >-
          The ID (or client ID) of a GitHub App installed on the calling repository with
          Administration read and write and Actions read. Pass its key as the
          app-private-key secret. Leave it empty to use RUNNER_ADMIN_TOKEN instead.
        default: ""
        type: string
    secrets:
      BOAT_API_KEY:
        required: true
      app-private-key:
        description: The private key (PEM) of the app that app-id names.
        required: false
      RUNNER_ADMIN_TOKEN:
        description: >-
          Instead of an app: a fine-grained token for the calling repository with
          Administration read and write and Actions read. The token Actions creates for the run cannot
          register runners.
        required: false
permissions: {}
jobs:
  daemon:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # The run's own token checks out the code and lists the run's jobs. The daemon uses the
    # app or RUNNER_ADMIN_TOKEN, which only the steps that call it get, not the build.
    permissions:
      contents: read
      actions: read
    env:
      SNAPSHOT: ${{ inputs.snapshot }}
      MACHINE_TYPE: ${{ inputs.machine_type }}
      MAX_BOXES: ${{ inputs.max_boxes }}
      POOL: ${{ inputs.pool }}
      NAME: ${{ inputs.name }}
    steps:
      - name: Credentials
        env:
          APP_ID: ${{ inputs.app-id }}
          APP_KEY: ${{ secrets.app-private-key }}
          PAT: ${{ secrets.RUNNER_ADMIN_TOKEN }}
        run: |
          if [ -n "$APP_ID$APP_KEY" ] && [ -n "$PAT" ]; then
            echo "::error::Pass app-id and app-private-key, or RUNNER_ADMIN_TOKEN, not both."
            exit 1
          elif [ -z "$PAT" ] && { [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; }; then
            echo "::error::Pass app-id and the app-private-key secret together, or RUNNER_ADMIN_TOKEN instead."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Surely-Works-LLC/sw-boat-runner
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked --release
      # The pool's label names this run and attempt, so no other run's daemon sees its
      # jobs and two runs never share a pool.
      - name: Policy
        run: |
          id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}${NAME:+-$NAME}"
          cat > policy.toml <<TOML
          repo = "$GITHUB_REPOSITORY"

          [[pool]]
          name = "run_$(echo "$id" | tr - _)"
          labels = ["self-hosted", "boat-$id"]
          machine_type = "$MACHINE_TYPE"
          snapshot = "$SNAPSHOT"
          max_boxes = $MAX_BOXES
          $POOL
          TOML
          target/release/sw-boat-runner check policy.toml
      # Written after the build, so no build script can read it. The daemon mints and renews
      # the app's installation token itself; a token minted here would expire after an
      # hour, and this job can run for six.
      - name: App key
        if: inputs.app-id != ''
        env:
          APP_KEY: ${{ secrets.app-private-key }}
          APP_KEY_FILE: ${{ runner.temp }}/github-app.pem
        run: (umask 077 && printf '%s\n' "$APP_KEY" > "$APP_KEY_FILE")
      - name: Run the daemon until the run's other jobs are done
        env:
          BOAT_API_KEY: ${{ secrets.BOAT_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
          GITHUB_APP_ID: ${{ inputs.app-id }}
          GITHUB_APP_PRIVATE_KEY_FILE: ${{ inputs.app-id != '' && format('{0}/github-app.pem', runner.temp) || '' }}
          # Listing this run's jobs needs only the run's own token.
          GH_TOKEN: ${{ github.token }}
        run: |
          target/release/sw-boat-runner run policy.toml &
          daemon=$!
          jobs="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100"
          # Every job but the daemons themselves. A job behind `needs` is listed only once
          # it is queued, so the run must look finished twice in a row.
          open='[.jobs[] | select(.status != "completed" and (.name | endswith("daemon") | not))] | length'
          idle=0
          while [ "$idle" -lt 2 ]; do
            kill -0 "$daemon"
            sleep 30
            if [ "$(gh api "$jobs" --jq "$open")" -eq 0 ]; then idle=$((idle + 1)); else idle=0; fi
          done
          kill "$daemon"
      - name: Delete the pool's machines and runners
        if: always()
        env:
          BOAT_API_KEY: ${{ secrets.BOAT_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
          GITHUB_APP_ID: ${{ inputs.app-id }}
          GITHUB_APP_PRIVATE_KEY_FILE: ${{ inputs.app-id != '' && format('{0}/github-app.pem', runner.temp) || '' }}
        run: |
          [ -f policy.toml ] || exit 0
          for _ in $(seq 20); do
            if target/release/sw-boat-runner drain policy.toml; then exit 0; fi
            sleep 15
          done
          exit 1
      - name: Delete the app's key
        if: always()
        env:
          APP_KEY_FILE: ${{ runner.temp }}/github-app.pem
        run: rm -f "$APP_KEY_FILE"
