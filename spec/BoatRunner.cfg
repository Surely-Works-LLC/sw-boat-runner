\* The hybrid preset with every fix on. CI derives the other passing models and
\* the counterexample models from this file and BoatRunnerFork.cfg with sed, so
\* keep one assignment, invariant or property per line, starting in column 0.
SPECIFICATION Spec
CONSTANTS
Machines = {m1, m2, m3}
InitStopped = {m1}
Jobs = {j1, j2}
NoJob = NoJob
NoMachine = NoMachine
Placement = {"slot", "resume", "fork"}
BoxCap = 2
MinUp = 0
Included = 1
PaidBudget = 1
MaxFaults = 2
FixCrashSpend = TRUE
FixRegSeen = TRUE
FixCrashSeen = TRUE
FixForkKey = TRUE
FixStaleAct = TRUE
FixKeptInflight = TRUE
FixListLag = TRUE
FixLostCreate = TRUE
FixLostSpend = TRUE
INVARIANT TypeOK
INVARIANT MaxBoxes
INVARIANT StartBudget
INVARIANT NoDoubleFork
PROPERTY NoBusyStop
PROPERTY OneJobPerRunner
PROPERTY EphemeralIsolation
PROPERTY ForkIsolation
PROPERTY NoLeak
PROPERTY NoStarvation
PROPERTY IdleStops
PROPERTY Settles
