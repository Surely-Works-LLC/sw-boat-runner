\* The fork preset with every fix on: no kept machines, so IdleStops is vacuous
\* and EphemeralIsolation is the design's property 6 itself. Same line format as
\* BoatRunner.cfg.
SPECIFICATION Spec
CONSTANTS
Machines = {m1, m2, m3}
InitStopped = {}
Jobs = {j1, j2}
NoJob = NoJob
NoMachine = NoMachine
Placement = {"fork"}
BoxCap = 2
MinUp = 0
Included = 2
PaidBudget = 1
MaxFaults = 2
FixCrashSpend = TRUE
FixRegSeen = TRUE
FixCrashSeen = TRUE
FixForkKey = TRUE
FixStaleAct = TRUE
FixKeptInflight = TRUE
FixListLag = TRUE
FixLostCreate = TRUE
FixLostSpend = TRUE
INVARIANT TypeOK
INVARIANT MaxBoxes
INVARIANT StartBudget
INVARIANT NoDoubleFork
PROPERTY NoBusyStop
PROPERTY OneJobPerRunner
PROPERTY EphemeralIsolation
PROPERTY NoLeak
PROPERTY NoStarvation
PROPERTY Settles
