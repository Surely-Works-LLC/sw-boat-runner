# The pool .github/workflows/self-hosted.yml runs this repository's tests on.
# The workflow replaces BOAT_SNAPSHOT with the repository variable of that name.
repo = "Surely-Works-LLC/sw-boat-runner"

[[pool]]
name = "ci"
labels = ["self-hosted", "sw-boat-runner"]
machine_type = "default"
snapshot = "BOAT_SNAPSHOT"
preset = "fork"
max_boxes = 2
fork_ttl_s = 1800
